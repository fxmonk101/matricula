<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Matricula">
  <title>Matricula</title>
  <!--
    Many records, one spine.

    Standalone file for the favicon, the web manifest and anywhere a URL is
    needed rather than a React component. The brand colour is baked in here
    because a favicon has no cascade to inherit from.
  -->
  <rect width="32" height="32" rx="8" fill="#1b5df5"/>
  <rect x="8" y="8" width="3" height="16" rx="1.5" fill="#ffffff"/>
  <rect x="13" y="8" width="11" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="13" y="14.5" width="7" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="13" y="21" width="9" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>
